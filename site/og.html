<!doctype html>
<!-- Source of og.png (1280×640). Re-render with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --window-size=1280,640 --screenshot=og.png og.html -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative; background: #f3f6fb; color: #111110;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); }
  .b1 { width: 620px; height: 620px; left: -160px; top: -300px; background: #c9ddfb; }
  .b2 { width: 520px; height: 520px; right: -120px; top: -160px; background: #cfe9f9; }
  .b3 { width: 460px; height: 460px; left: 420px; bottom: -300px; background: #dedcff; opacity: .7; }
  .orb { position: absolute; left: 96px; top: 50%; transform: translateY(-50%); width: 280px; height: 280px; }
  .orb img { width: 100%; height: 100%; border-radius: 50%; display: block; box-shadow: 0 40px 90px -36px rgba(47,93,230,.55), 0 0 0 1px rgba(17,17,16,.06); }
  .orb i { position: absolute; border-radius: 50%; border: 1px solid rgba(17,17,16,.1); inset: -22px; }
  .orb i.r2 { inset: -52px; border-color: rgba(17,17,16,.05); }
  .copy { position: absolute; left: 470px; top: 50%; transform: translateY(-50%); }
  .brand { font-size: 20px; font-weight: 500; letter-spacing: -.01em; margin-bottom: 30px; }
  .brand em { font-style: normal; color: #8f96a3; font-weight: 400; margin-left: .3em; }
  h1 { margin: 0 0 24px; font-size: 76px; font-weight: 500; letter-spacing: -.035em; line-height: 1.1; }
  p { margin: 0; font-size: 22px; color: #5f5f5a; line-height: 1.6; max-width: 700px; }
  .foot { position: absolute; left: 470px; bottom: 54px; display: flex; gap: 28px; font: 500 15px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .08em; color: #8f96a3; text-transform: uppercase; }
  .foot b { color: #2f5de6; font-weight: 500; }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="orb"><img src="logo.png" alt=""><i></i><i class="r2"></i></div>
  <div class="copy">
    <div class="brand">Serverless Agent <em>Gateway</em></div>
    <h1>免服务器的群聊<br>全能 Agent 网关</h1>
    <p>QQ、Telegram、HTTP → 带工具调用的 agent loop → 回复。跑在 Vercel Functions 上，有消息才运行。</p>
  </div>
  <div class="foot"><b>serverless-agent.cnday.cn</b><span>MIT</span><span>Vercel · Supabase · OpenRouter</span></div>
</body>
</html>
